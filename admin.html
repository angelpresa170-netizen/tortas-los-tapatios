<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Tortas Ahogadas Los Tapatíos</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: none; }
    input { background: #2a2a2a; color: white; }
    button { background: #a80022; color: white; font-weight: bold; cursor: pointer; }
    .product-list { margin-top: 20px; }
    .item { background: #2a2a2a; padding: 10px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .btn-del { background: #ff4444; width: auto; padding: 5px 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Administrador de Menú</h2>
  <input type="text" id="nombre" placeholder="Nombre del platillo">
  <input type="number" id="precio" placeholder="Precio ($)">
  <button onclick="guardarProducto()">Agregar Platillo</button>

  <h3>Platillos en tiempo real</h3>
  <div id="lista" class="product-list">Cargando...</div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Reemplaza los siguientes datos con los de tu consola de Firebase
  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "TU_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://TU_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "TU_PROJECT_ID",
    storageBucket: "TU_PROJECT_ID.appspot.com",
    messagingSenderId: "TU_SENDER_ID",
    appId: "TU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const productosRef = ref(db, 'productos');

  // Guardar platillo en la nube
  window.guardarProducto = function() {
    const nombre = document.getElementById('nombre').value;
    const precio = document.getElementById('precio').value;

    if (!nombre || !precio) return alert("Llena todos los campos");

    const nuevoRef = push(productosRef);
    set(nuevoRef, { nombre: nombre, precio: precio })
      .then(() => {
        document.getElementById('nombre').value = '';
        document.getElementById('precio').value = '';
      });
  };

  // Escuchar cambios en vivo
  onValue(productosRef, (snapshot) => {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';
    const data = snapshot.val();

    if (data) {
      Object.keys(data).forEach(id => {
        const item = data[id];
        lista.innerHTML += `
          <div class="item">
            <span>${item.nombre} - $${item.precio}</span>
            <button class="btn-del" onclick="eliminarProducto('${id}')">Eliminar</button>
          </div>
        `;
      });
    } else {
      lista.innerHTML = '<p>No hay platillos registrados.</p>';
    }
  });

  // Eliminar producto de la nube
  window.eliminarProducto = function(id) {
    remove(ref(db, 'productos/' + id));
  };
</script>
</body>
</html>
