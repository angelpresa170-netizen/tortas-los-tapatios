<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Los Tapatíos & Carnitas</title>
  <style>
    :root {
      --garnet-main: #800020;
      --garnet-light: #a00028;
      --carnita-accent: #D9B59C;
      --bg-dark: #0d0d10;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(217, 181, 156, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      padding: 20px;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 25px;
    }

    h1, h2 {
      color: var(--carnita-accent);
      margin-bottom: 15px;
    }

    /* SWITCH ESTILO IOS FLUIDO */
    .switch-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333;
      transition: .4s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-radius: 34px;
      border: 1px solid var(--glass-border);
    }

    .slider:before {
      position: absolute; content: "";
      height: 26px; width: 26px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .4s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--garnet-light);
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .btn-action {
      background: var(--garnet-main);
      color: #fff;
      border: 1px solid var(--carnita-accent);
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }
  </style>
</head>
<body>

  <h1>Panel de Administración</h1>

  <!-- SWITCH EVENTOS -->
  <div class="glass-panel switch-container">
    <div>
      <h2>Módulo de Contratación de Eventos</h2>
      <p style="color:#ccc; font-size: 0.9rem;">Activa o desactiva la disponibilidad de banquetes en tiempo real para todos los clientes.</p>
    </div>
    <label class="switch">
      <input type="checkbox" id="events-toggle" checked onchange="toggleEvents(this.checked)">
      <span class="slider"></span>
    </label>
  </div>

  <!-- GESTOR DE MENÚ -->
  <div class="glass-panel">
    <h2>Agregar Platillo / Promoción</h2>
    <div class="form-row">
      <input type="text" id="item-name" placeholder="Nombre platillo" style="flex:2;">
      <input type="number" id="item-price" placeholder="Precio ($)" style="flex:1;">
      <button class="btn-action" onclick="addMenuItem()">Agregar</button>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('tapatos_sync');

    let state = {
      eventsActive: true,
      menu: [
        { id: 1, name: "Torta Ahogada Clasica", price: 85, desc: "Pan birote salado con carnitas jugosas." },
        { id: 2, name: "Tacos Dorados (Orden 3)", price: 60, desc: "Rellenos de papa o requesón con carnitas encima." }
      ],
      packages: [
        { id: 'p1', name: "Paquete 50 Personas", capacity: 50, price: 4500, features: [{text:"Carnitas mixtas 12kg", inc: true}, {text:"Salsas y verduras", inc: true}, {text:"Bebidas incluidas", inc: false}] },
        { id: 'p2', name: "Paquete 100 Personas", capacity: 100, price: 8500, features: [{text:"Carnitas mixtas 25kg", inc: true}, {text:"Salsas y verduras", inc: true}, {text:"Personal de servicio", inc: true}] }
      ]
    };

    function sync() {
      // Emitir el cambio a la página web pública
      channel.postMessage({ type: 'UPDATE_STATE', payload: state });
    }

    function toggleEvents(active) {
      state.eventsActive = active;
      sync();
    }

    function addMenuItem() {
      const name = document.getElementById('item-name').value;
      const price = parseFloat(document.getElementById('item-price').value);

      if(name && price) {
        state.menu.push({
          id: Date.now(),
          name: name,
          price: price,
          desc: "Nuevo producto agregado"
        });
        sync();
        document.getElementById('item-name').value = '';
        document.getElementById('item-price').value = '';
        alert("¡Platillo agregado y sincronizado!");
      }
    }
  </script>
</body>
</html>
