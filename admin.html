<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Los Tapatíos & Carnitas</title>

  <!-- Socket.io CDN de tu servidor Render -->
  <script src="https://armm-app.onrender.com/socket.io/socket.io.js"></script>

  <style>
    :root {
      --garnet-main: #800020;
      --garnet-light: #a00028;
      --carnita-accent: #D9B59C;
      --bg-dark: #0d0d10;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(217, 181, 156, 0.2);
      --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: #fff; padding: 20px; max-width: 900px; margin: 0 auto; }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 25px;
    }

    h1, h2, h3 { color: var(--carnita-accent); margin-bottom: 15px; }

    /* SWITCH TÁCTIL */
    .switch-row { display: flex; align-items: center; justify-content: space-between; }
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333; transition: .4s; border-radius: 34px; border: 1px solid var(--glass-border);
    }
    .slider:before {
      position: absolute; content: ""; height: 26px; width: 26px; left: 3px; bottom: 3px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--garnet-light); }
    input:checked + .slider:before { transform: translateX(26px); }

    .btn-action {
      background: linear-gradient(135deg, var(--garnet-light), var(--garnet-main));
      color: #fff; border: 1px solid var(--carnita-accent);
      padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer;
      transition: transform 0.2s var(--spring-easing);
    }
    .btn-action:active { transform: scale(0.94); }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; color: var(--carnita-accent); font-size: 0.85rem; }
    input {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05); color: #fff; outline: none;
    }

    /* MATRIZ CHECKBOXES ESTILO EXAMEN */
    .checkbox-matrix {
      display: flex; flex-direction: column; gap: 8px; margin: 15px 0;
      background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px;
    }
    .matrix-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem; }

    /* TOAST BANNER */
    #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; }
    .toast-banner {
      background: rgba(21, 21, 26, 0.95); border: 1px solid var(--carnita-accent);
      color: #fff; padding: 12px 24px; border-radius: 50px; font-weight: 600; backdrop-filter: blur(15px);
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <h1>Panel de Administración</h1>

  <!-- SWITCH GENERAL DE EVENTOS -->
  <div class="glass-panel switch-row">
    <div>
      <h2>Módulo de Eventos en Web Pública</h2>
      <p style="color:#aaa; font-size:0.85rem;">Muestra u oculta la sección de banquetes de inmediato.</p>
    </div>
    <label class="switch">
      <input type="checkbox" id="events-toggle" onchange="toggleEventsModule(this.checked)">
      <span class="slider"></span>
    </label>
  </div>

  <!-- CREADOR DE INCLUSIONES TIPO OPCIÓN MÚLTIPLE -->
  <div class="glass-panel">
    <h2>1. Banco Global de Inclusiones (Reactivos)</h2>
    <div style="display:flex; gap:10px;">
      <input type="text" id="new-inclusion-text" placeholder="Ej: 12kg Carnitas, Servicio 4hrs, Meseros...">
      <button class="btn-action" onclick="addGlobalInclusion()">Añadir</button>
    </div>
    <div id="global-inclusions-list" style="margin-top:10px; font-size:0.85rem; color:#ccc;"></div>
  </div>

  <!-- CREAR PAQUETE DE EVENTO -->
  <div class="glass-panel">
    <h2>2. Publicar Paquete de Evento</h2>
    <div class="form-group"><label>Nombre del Paquete</label><input type="text" id="pkg-name" placeholder="Ej: Paquete 100 Personas"></div>
    <div class="form-group"><label>Precio ($)</label><input type="number" id="pkg-price" placeholder="Ej: 8500"></div>
    
    <label style="color:var(--carnita-accent); font-size:0.85rem;">Selecciona las Inclusiones (✔️ Incluido / ❌ No incluido)</label>
    <div class="checkbox-matrix" id="package-inclusions-matrix"></div>

    <button class="btn-action" onclick="publishPackage()">Publicar Paquete</button>
  </div>

  <!-- CREAR PLATILLO MENÚ TRADICIONAL -->
  <div class="glass-panel">
    <h2>3. Publicar Platillo en el Menú</h2>
    <div class="form-group"><label>Nombre del Platillo</label><input type="text" id="menu-name" placeholder="Ej: Torta Ahogada Clásica"></div>
    <div class="form-group"><label>Precio ($)</label><input type="number" id="menu-price" placeholder="Ej: 85"></div>
    <button class="btn-action" onclick="publishMenuItem()">Publicar Platillo</button>
  </div>

  <script>
    const socket = io("https://armm-app.onrender.com");

    let state = {
      eventsActive: true,
      globalInclusions: ["12kg Carnitas Tradicionales", "Salsas y Verduras", "Servicio de 4 Horas", "Meseros Uniformados"],
      menu: [],
      packages: []
    };

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast-banner';
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    socket.on('update_data', (data) => {
      state = data;
      if(!state.globalInclusions) state.globalInclusions = ["12kg Carnitas Tradicionales", "Salsas y Verduras"];
      document.getElementById('events-toggle').checked = state.eventsActive;
      renderAdminUI();
    });

    function renderAdminUI() {
      // Render Banco Global
      document.getElementById('global-inclusions-list').innerHTML = "Inclusiones registradas: " + state.globalInclusions.join(', ');

      // Render Matriz de Selección
      const matrix = document.getElementById('package-inclusions-matrix');
      matrix.innerHTML = state.globalInclusions.map((text, idx) => `
        <div class="matrix-item">
          <span>${text}</span>
          <input type="checkbox" id="inc-chk-${idx}" checked style="width:auto;">
        </div>
      `).join('');
    }

    function toggleEventsModule(val) {
      state.eventsActive = val;
      sync();
      showToast("Estado de eventos actualizado");
    }

    function addGlobalInclusion() {
      const txt = document.getElementById('new-inclusion-text').value;
      if(txt) {
        state.globalInclusions.push(txt);
        document.getElementById('new-inclusion-text').value = '';
        sync();
        showToast("Reactivo agregado al banco");
      }
    }

    function publishPackage() {
      const name = document.getElementById('pkg-name').value;
      const price = document.getElementById('pkg-price').value;
      if(!name || !price) return showToast("Ingresa nombre y precio");

      const inclusions = state.globalInclusions.map((text, idx) => ({
        text: text,
        included: document.getElementById(`inc-chk-${idx}`).checked
      }));

      state.packages.push({ name, price: parseFloat(price), inclusions });
      sync();
      showToast("Paquete publicado en tiempo real");
    }

    function publishMenuItem() {
      const name = document.getElementById('menu-name').value;
      const price = document.getElementById('menu-price').value;
      if(name && price) {
        state.menu.push({ name, price: parseFloat(price) });
        sync();
        showToast("Platillo publicado");
      }
    }

    function sync() {
      socket.emit('admin_update_data', state);
    }
  </script>
</body>
</html>
