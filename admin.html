<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Los Tapatíos & Carnitas</title>
  <style>
    :root {
      --garnet-main: #800020; --garnet-light: #a00028; --carnita-accent: #D9B59C;
      --bg-dark: #0d0d10; --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(217, 181, 156, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: #fff; padding: 20px; }

    .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 25px; }
    h1, h2 { color: var(--carnita-accent); margin-bottom: 15px; }

    .switch-container { display: flex; align-items: center; justify-content: space-between; }
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333; transition: .4s; border-radius: 34px; border: 1px solid var(--glass-border);
    }
    .slider:before {
      position: absolute; content: ""; height: 26px; width: 26px; left: 3px; bottom: 3px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--garnet-light); }
    input:checked + .slider:before { transform: translateX(26px); }

    .btn-action { background: var(--garnet-main); color: #fff; border: 1px solid var(--carnita-accent); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; color: var(--carnita-accent); font-size: 0.85rem; }
    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.05); color: #fff; }
  </style>
</head>
<body>

  <h1>Panel de Control</h1>

  <div class="glass-panel switch-container">
    <div>
      <h2>Módulo de Eventos en Web Pública</h2>
      <p style="color:#ccc; font-size: 0.9rem;">Prende o apaga la pestaña de banquetes en tiempo real.</p>
    </div>
    <label class="switch">
      <input type="checkbox" id="events-toggle" checked onchange="toggleEvents(this.checked)">
      <span class="slider"></span>
    </label>
  </div>

  <div class="glass-panel">
    <h2>Publicar Nuevo Platillo</h2>
    <div class="form-group"><label>Nombre</label><input type="text" id="m-name" placeholder="Ej: Torta Ahogada"></div>
    <div class="form-group"><label>Precio ($)</label><input type="number" id="m-price" placeholder="Ej: 85"></div>
    <button class="btn-action" onclick="addMenu()">Publicar en Web</button>
  </div>

  <div class="glass-panel">
    <h2>Publicar Paquete de Evento</h2>
    <div class="form-group"><label>Nombre del Paquete</label><input type="text" id="p-name" placeholder="Ej: Paquete 100 Personas"></div>
    <div class="form-group"><label>Precio ($)</label><input type="number" id="p-price" placeholder="Ej: 8500"></div>
    <div class="form-group"><label>Inclusiones</label><input type="text" id="p-feat" placeholder="Carnitas 25kg, Salsas, Servicio"></div>
    <button class="btn-action" onclick="addPkg()">Publicar Paquete</button>
  </div>

  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
  <script>
    const pubnub = new PubNub({
      publishKey: "pub-c-89736e0d-b4b1-4f1d-b82b-6c4ff5511bd9",
      subscribeKey: "sub-c-e3627d3b-6351-4d37-a25e-3ca9762fa53e",
      userId: "user_admin"
    });

    let state = {
      eventsActive: true,
      menu: [{ name: "Torta Ahogada Clásica", price: 85, desc: "Birote salado con carnitas" }],
      packages: [{ name: "Paquete 50 Personas", price: 4500, features: "12kg Carnitas, Salsas, Verduras" }]
    };

    function publishState() {
      pubnub.publish({
        channel: 'tapatios_channel',
        message: state
      });
    }

    function toggleEvents(val) {
      state.eventsActive = val;
      publishState();
    }

    function addMenu() {
      const name = document.getElementById('m-name').value;
      const price = document.getElementById('m-price').value;
      if(name && price) {
        state.menu.push({ name, price: parseFloat(price) });
        publishState();
        alert("¡Platillo enviado a todos los dispositivos!");
      }
    }

    function addPkg() {
      const name = document.getElementById('p-name').value;
      const price = document.getElementById('p-price').value;
      const features = document.getElementById('p-feat').value;
      if(name && price) {
        state.packages.push({ name, price: parseFloat(price), features });
        publishState();
        alert("¡Paquete de evento publicado!");
      }
    }

    // Publicar estado inicial al abrir
    setTimeout(publishState, 1000);
  </script>
</body>
</html>
