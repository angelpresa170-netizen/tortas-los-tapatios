<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Los Tapatíos</title>
    <style>
        :root {
            --granate: #800020;
            --carnita: #D9B59C;
            --bg-dark: #121212;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(217, 181, 156, 0.2);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: #f5f5f5;
        }

        header {
            background: var(--granate);
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--carnita);
        }

        header h1 {
            margin: 0;
            color: var(--carnita);
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            padding: 20px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media(max-width: 900px) {
            .dashboard-container { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
        }

        .panel h2 {
            margin-top: 0;
            color: var(--carnita);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        /* FORMULARIO PRODUCTOS */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9rem; }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }

        .btn {
            background: var(--carnita);
            color: var(--granate);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { background: #fff; }

        /* LISTA DE PLATILLOS */
        .item-list { margin-top: 20px; max-height: 300px; overflow-y: auto; }
        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 10px; border-radius: 6px; margin-bottom: 8px;
        }
        .btn-delete { background: #ff4c4c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        /* PEDIDOS ACTIVOS */
        .pedidos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .pedido-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--carnita);
            border-radius: 10px;
            padding: 15px;
            position: relative;
        }
        .pedido-header {
            display: flex; justify-content: space-between;
            border-bottom: 1px dashed #555; padding-bottom: 10px; margin-bottom: 10px;
        }
        .badge { background: var(--granate); color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; }
        
        .estatus-controls {
            display: flex; gap: 5px; margin-top: 15px;
        }
        .estatus-btn {
            flex: 1; padding: 8px 5px; font-size: 0.8rem; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold;
        }
        .btn-prep { background: #f39c12; }
        .btn-ready { background: #27ae60; }
        .btn-camino { background: #2980b9; }

    </style>
</head>
<body>

    <header>
        <h1>⚙️ Admin | Los Tapatíos</h1>
        <a href="index.html" target="_blank" style="color: white; text-decoration: none; border: 1px solid white; padding: 5px 15px; border-radius: 20px;">Ver Tienda</a>
    </header>

    <div class="dashboard-container">
        
        <!-- COLUMNA 1: GESTIÓN DE MENÚ -->
        <div class="panel">
            <h2>Agregar al Menú</h2>
            <div class="input-group">
                <label>Categoría</label>
                <select id="prodCategoria">
                    <option value="Alimentos">Alimentos (Tortas, Tacos)</option>
                    <option value="Paquetes">Paquetes</option>
                    <option value="Especialidades">Especialidades / Bebidas</option>
                </select>
            </div>
            <div class="input-group">
                <label>Nombre del Platillo</label>
                <input type="text" id="prodNombre" placeholder="Ej. Torta Ahogada Sencilla">
            </div>
            <div class="input-group">
                <label>Descripción (Opcional)</label>
                <textarea id="prodDesc" rows="2" placeholder="Ej. Carnita, salsa al gusto y cebolla."></textarea>
            </div>
            <div class="input-group">
                <label>Precio ($)</label>
                <input type="number" id="prodPrecio" placeholder="0.00">
            </div>
            <button class="btn" onclick="guardarProducto()">Guardar Platillo</button>

            <h3 style="margin-top: 30px; font-size: 1rem; color: var(--carnita);">Platillos Actuales:</h3>
            <div class="item-list" id="listaProductos"></div>
        </div>

        <!-- COLUMNA 2: MONITOR DE PEDIDOS -->
        <div class="panel">
            <h2>Monitor de Pedidos en Vivo 📡</h2>
            <div class="pedidos-grid" id="pedidosContainer">
                <p style="color: #888;">Buscando pedidos...</p>
            </div>
        </div>

    </div>

    <script>
        // ======= SECCIÓN: INVENTARIO / MENÚ =======
        function guardarProducto() {
            let categoria = document.getElementById('prodCategoria').value;
            let nombre = document.getElementById('prodNombre').value;
            let desc = document.getElementById('prodDesc').value;
            let precio = parseFloat(document.getElementById('prodPrecio').value);

            if(!nombre || isNaN(precio)) return alert("Por favor ingresa un nombre y un precio válido.");

            let productos = JSON.parse(localStorage.getItem('tapatios_productos') || '[]');
            productos.push({ id: Date.now(), categoria, nombre, desc, precio });
            localStorage.setItem('tapatios_productos', JSON.stringify(productos));

            // Limpiar form
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodDesc').value = '';
            document.getElementById('prodPrecio').value = '';
            
            cargarProductos();
            alert("Platillo agregado al menú.");
        }

        function cargarProductos() {
            let productos = JSON.parse(localStorage.getItem('tapatios_productos') || '[]');
            let contenedor = document.getElementById('listaProductos');
            contenedor.innerHTML = '';

            productos.forEach((p, index) => {
                contenedor.innerHTML += `
                    <div class="item-row">
                        <div>
                            <b style="color: white;">${p.nombre}</b> <br>
                            <span style="font-size: 0.8rem; color: #aaa;">$${p.precio} | ${p.categoria}</span>
                        </div>
                        <button class="btn-delete" onclick="eliminarProducto(${index})">Borrar</button>
                    </div>
                `;
            });
        }

        function eliminarProducto(index) {
            let productos = JSON.parse(localStorage.getItem('tapatios_productos') || '[]');
            productos.splice(index, 1);
            localStorage.setItem('tapatios_productos', JSON.stringify(productos));
            cargarProductos();
        }


        // ======= SECCIÓN: PEDIDOS EN VIVO =======
        function cargarPedidos() {
            let pedidos = JSON.parse(localStorage.getItem('tapatios_pedidos') || '[]');
            let contenedor = document.getElementById('pedidosContainer');
            
            if(pedidos.length === 0) {
                contenedor.innerHTML = '<p style="color: #888;">No hay pedidos aún.</p>';
                return;
            }

            // Mostrar los más recientes primero
            pedidos.reverse(); 
            contenedor.innerHTML = '';

            pedidos.forEach(pedido => {
                // Construir lista de items
                let itemsHTML = '';
                pedido.items.forEach(i => {
                    itemsHTML += `<div style="font-size:0.9rem; margin-bottom:3px;">- ${i.nombre}</div>`;
                });

                // Construir detalles del cliente
                let detallesEnvio = `
                    <p style="margin: 5px 0; font-size: 0.9rem;">👤 ${pedido.cliente.nombre} | 📞 ${pedido.cliente.tel}</p>
                    <p style="margin: 5px 0; font-size: 0.9rem; color: var(--carnita);">🚚 ${pedido.cliente.tipo}</p>
                    ${pedido.cliente.direccion ? `<p style="margin: 5px 0; font-size: 0.9rem;">📍 ${pedido.cliente.direccion}</p>` : ''}
                    <p style="margin: 5px 0; font-size: 0.9rem; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 4px;">💳 Pago: <b>${pedido.cliente.pago}</b> <br> <span style="color:#aaa; font-size:0.8rem;">${pedido.cliente.cambio}</span></p>
                `;

                contenedor.innerHTML += `
                    <div class="pedido-card">
                        <div class="pedido-header">
                            <b>${pedido.id}</b>
                            <span class="badge">${pedido.estatus}</span>
                        </div>
                        <p style="margin:0; font-size:0.8rem; color:#888;">Hora: ${pedido.fecha}</p>
                        
                        <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
                        ${detallesEnvio}
                        
                        <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
                        <b>Orden:</b>
                        <div style="margin: 10px 0; max-height: 100px; overflow-y: auto;">
                            ${itemsHTML}
                        </div>
                        <div style="font-size: 1.2rem; text-align: right; color: var(--carnita); font-weight: bold;">
                            Total: $${pedido.total.toFixed(2)}
                        </div>

                        <div class="estatus-controls">
                            <button class="estatus-btn btn-prep" onclick="actualizarEstatus('${pedido.id}', 'En preparación')">Preparando</button>
                            <button class="estatus-btn btn-camino" onclick="actualizarEstatus('${pedido.id}', 'En camino')">En camino</button>
                            <button class="estatus-btn btn-ready" onclick="actualizarEstatus('${pedido.id}', '¡Tu pedido está listo!')">Listo</button>
                        </div>
                        
                        <button style="width:100%; margin-top:10px; background:transparent; border:1px solid #ff4c4c; color:#ff4c4c; padding:5px; border-radius:4px; cursor:pointer;" onclick="eliminarPedido('${pedido.id}')">Archivar / Eliminar Pedido</button>
                    </div>
                `;
            });
        }

        function actualizarEstatus(id, nuevoEstatus) {
            let pedidos = JSON.parse(localStorage.getItem('tapatios_pedidos') || '[]');
            let index = pedidos.findIndex(p => p.id === id);
            if(index !== -1) {
                pedidos[index].estatus = nuevoEstatus;
                localStorage.setItem('tapatios_pedidos', JSON.stringify(pedidos));
                cargarPedidos();
            }
        }

        function eliminarPedido(id) {
            if(confirm("¿Seguro que deseas eliminar este pedido?")) {
                let pedidos = JSON.parse(localStorage.getItem('tapatios_pedidos') || '[]');
                pedidos = pedidos.filter(p => p.id !== id);
                localStorage.setItem('tapatios_pedidos', JSON.stringify(pedidos));
                cargarPedidos();
            }
        }

        // Iniciar
        window.onload = () => {
            cargarProductos();
            cargarPedidos();
            // Actualizar monitor cada 3 segundos automáticamente
            setInterval(cargarPedidos, 3000);
        };
    </script>
</body>
</html>
