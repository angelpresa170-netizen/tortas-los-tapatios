<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los Tapatíos & Carnitas - Web Pública</title>
  <style>
    :root {
      --garnet-main: #800020;
      --garnet-light: #a00028;
      --garnet-dark: #4a0013;
      --carnita-accent: #D9B59C;
      --bg-dark: #0d0d10;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(217, 181, 156, 0.2);
      --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: #fff; padding-bottom: 100px; overflow-x: hidden; }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: transform 0.3s var(--spring-easing), box-shadow 0.3s ease;
    }

    .btn-floating {
      background: linear-gradient(135deg, var(--garnet-light), var(--garnet-main));
      color: #fff; border: 1px solid var(--carnita-accent);
      padding: 12px 24px; border-radius: 50px; font-weight: 600; cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(128, 0, 32, 0.5);
      transition: transform 0.2s var(--spring-easing); display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-floating:active { transform: scale(0.94); }

    header {
      position: sticky; top: 0; z-index: 100; padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(13, 13, 16, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border);
    }

    .brand-title { color: var(--carnita-accent); font-size: 1.2rem; font-weight: 700; }
    .cart-trigger { position: relative; }
    .cart-badge {
      position: absolute; top: -5px; right: -5px; background: var(--carnita-accent); color: var(--garnet-dark);
      font-size: 0.75rem; font-weight: bold; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }

    .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
    .section-title { color: var(--carnita-accent); margin: 25px 0 15px 0; font-size: 1.5rem; border-left: 4px solid var(--garnet-main); padding-left: 10px; }

    .grid-menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .item-card { padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .item-price { color: var(--carnita-accent); font-size: 1.2rem; font-weight: bold; }

    #events-section { display: none; margin-top: 40px; }
    .events-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .package-card { padding: 25px; border: 1px solid var(--carnita-accent); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
      z-index: 1000; display: none; justify-content: center; align-items: flex-end;
    }
    .modal-content {
      width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto;
      border-radius: 30px 30px 0 0; padding: 25px; background: #15151a; border: 1px solid var(--glass-border);
      transform: translateY(100%); transition: transform 0.3s var(--spring-easing);
    }
    .modal-overlay.active { display: flex; }
    .modal-overlay.active .modal-content { transform: translateY(0); }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: var(--carnita-accent); font-size: 0.85rem; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.05); color: #fff; outline: none;
    }

    /* WHEEL TIME PICKER */
    .wheel-time {
      display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; scroll-snap-type: x mandatory;
    }
    .time-slot {
      flex: 0 0 90px; padding: 10px; text-align: center; border: 1px solid var(--glass-border);
      border-radius: 12px; background: rgba(255,255,255,0.03); cursor: pointer; scroll-snap-align: center;
    }
    .time-slot.selected { background: var(--garnet-main); border-color: var(--carnita-accent); font-weight: bold; }

    /* CHECKBOXES REGLAS PERSONALIZADAS */
    .custom-option {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px; border-bottom: 1px solid var(--glass-border);
    }
    .custom-option.disabled { opacity: 0.3; pointer-events: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">LOS TAPATÍOS & CARNITAS</div>
    <button class="btn-floating cart-trigger" onclick="toggleCart()">
      🛒 Carrito <span class="cart-badge" id="cart-count">0</span>
    </button>
  </header>

  <div class="container">
    <h2 class="section-title">Menú Tradicional & Promociones</h2>
    <div class="grid-menu" id="menu-container"></div>

    <div id="events-section">
      <h2 class="section-title">Contratación de Eventos y Banquetes</h2>
      <div class="events-grid" id="events-container"></div>
    </div>
  </div>

  <!-- MODAL CARRITO -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-content">
      <h2 style="color:var(--carnita-accent); margin-bottom: 15px;">Tu Pedido</h2>
      <div id="cart-items"></div>
      <hr style="border-color: var(--glass-border); margin: 15px 0;">
      <h3 style="text-align: right; margin-bottom: 15px;">Total: <span id="cart-total">$0</span></h3>
      
      <div class="form-group">
        <label>Tipo de Entrega</label>
        <select id="delivery-type" onchange="document.getElementById('address-field').style.display = this.value === 'delivery' ? 'block' : 'none'">
          <option value="pickup">Recoger en Sucursal</option>
          <option value="delivery">A Domicilio</option>
        </select>
      </div>
      <div class="form-group" id="address-field" style="display:none;">
        <label>Dirección Completa</label>
        <input type="text" placeholder="Calle, número, colonia...">
      </div>
      <div class="form-group">
        <label>Método de Pago</label>
        <select id="payment-method" onchange="document.getElementById('cash-change-field').style.display = this.value === 'cash' ? 'block' : 'none'">
          <option value="cash">Efectivo</option>
          <option value="card">Tarjeta al entregar</option>
          <option value="transfer">Transferencia</option>
        </select>
      </div>
      <div class="form-group" id="cash-change-field">
        <label>¿Con cuánto vas a pagar? (Para cambio)</label>
        <input type="number" placeholder="Ej: $500">
      </div>
      <button class="btn-floating" style="width:100%; justify-content: center;" onclick="alert('¡Pedido enviado!'); toggleCart();">Confirmar Pedido</button>
    </div>
  </div>

  <!-- MODAL CHECKOUT & CREADOR DE EVENTOS -->
  <div class="modal-overlay" id="event-modal">
    <div class="modal-content">
      <h2 style="color:var(--carnita-accent); margin-bottom: 15px;" id="event-modal-title">Agendar Evento</h2>
      
      <!-- CREADOR PERSONALIZADO (SI ELIGE PERSONALIZAR) -->
      <div id="custom-builder-section" style="display:none; margin-bottom: 20px;">
        <label style="color:var(--carnita-accent); font-size:0.85rem;">1. Número de Invitados</label>
        <select id="guests-count" onchange="updateCustomRules()">
          <option value="50">50 Personas</option>
          <option value="100">100 Personas</option>
          <option value="150">150 Personas</option>
          <option value="200">200 Personas</option>
        </select>
        
        <label style="color:var(--carnita-accent); font-size:0.85rem; margin-top:10px; display:block;">2. Personaliza tu Menú</label>
        <div class="custom-option"><label><input type="checkbox" id="opt-premium" onchange="updateCustomRules()"> Menú Premium (Carnitas + Costilla)</label></div>
        <div class="custom-option" id="container-suave"><label><input type="checkbox" id="opt-suave"> Salsa Extra Suave (Incompatible con Premium)</label></div>
        <div class="custom-option"><label><input type="checkbox"> Meseros (Incluido en +100 personas)</label></div>
      </div>

      <div class="form-group">
        <label>Nombre del Contratante</label>
        <input type="text" placeholder="Tu nombre completo">
      </div>
      <div class="form-group">
        <label>Teléfono de Contacto</label>
        <input type="tel" placeholder="33 0000 0000">
      </div>
      <div class="form-group">
        <label>Dirección del Evento</label>
        <input type="text" placeholder="Calle y número">
      </div>
      <div class="form-group">
        <label>Fecha (Calendario)</label>
        <input type="date" id="event-date">
      </div>
      <div class="form-group">
        <label>Hora de Inicio (Selecciona una)</label>
        <div class="wheel-time">
          <div class="time-slot" onclick="selectTime(this)">12:00 PM</div>
          <div class="time-slot" onclick="selectTime(this)">02:00 PM</div>
          <div class="time-slot" onclick="selectTime(this)">04:00 PM</div>
          <div class="time-slot" onclick="selectTime(this)">06:00 PM</div>
          <div class="time-slot" onclick="selectTime(this)">08:00 PM</div>
        </div>
      </div>

      <button class="btn-floating" style="width:100%; justify-content: center;" onclick="submitEvent()">Confirmar Reservación</button>
    </div>
  </div>

  <!-- CONEXIÓN EN TIEMPO REAL SIN CONFIGURACIÓN COMPLICADA -->
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>

  <script>
    // Servidor global automático listo para usar
    const pubnub = new PubNub({
      publishKey: "pub-c-89736e0d-b4b1-4f1d-b82b-6c4ff5511bd9",
      subscribeKey: "sub-c-e3627d3b-6351-4d37-a25e-3ca9762fa53e",
      userId: "user_public_" + Math.random()
    });

    let state = { eventsActive: true, menu: [], packages: [] };
    let selectedTimeStr = "";

    pubnub.subscribe({ channels: ['tapatios_channel'] });
    pubnub.addListener({
      message: function(event) {
        state = event.message;
        renderAll();
      }
    });

    function renderAll() {
      // Render Menú
      const menuContainer = document.getElementById('menu-container');
      menuContainer.innerHTML = state.menu.map(item => `
        <div class="glass-card item-card">
          <div><h3>${item.name}</h3><p>${item.desc || ''}</p></div>
          <div style="display:flex; justify-style:space-between; align-items:center; margin-top:10px;">
            <span class="item-price">$${item.price}</span>
            <button class="btn-floating" onclick="alert('¡Agregado!')">+</button>
          </div>
        </div>
      `).join('');

      // Render Eventos
      const eventsSec = document.getElementById('events-section');
      eventsSec.style.display = state.eventsActive ? 'block' : 'none';

      const eventsContainer = document.getElementById('events-container');
      let html = state.packages.map(pkg => `
        <div class="glass-card package-card">
          <h3>${pkg.name}</h3>
          <div class="item-price" style="margin: 10px 0;">$${pkg.price} MXN</div>
          <p style="color:#ccc; font-size:0.85rem;">${pkg.features}</p>
          <button class="btn-floating" style="width:100%; justify-content:center; margin-top:15px;" onclick="openEventModal('${pkg.name}', false)">Contratar</button>
        </div>
      `).join('');

      html += `
        <div class="glass-card package-card" style="border-style:dashed;">
          <h3>Crea tu Paquete</h3>
          <p style="color:#ccc; font-size:0.85rem; margin:10px 0;">Arma el menú a tu gusto con límites automáticos.</p>
          <button class="btn-floating" style="width:100%; justify-content:center;" onclick="openEventModal('Paquete Personalizado', true)">Diseñar Paquete</button>
        </div>
      `;
      eventsContainer.innerHTML = html;
    }

    function openEventModal(title, isCustom) {
      document.getElementById('event-modal-title').innerText = title;
      document.getElementById('custom-builder-section').style.display = isCustom ? 'block' : 'none';
      document.getElementById('event-modal').classList.add('active');
    }

    function selectTime(element) {
      document.querySelectorAll('.time-slot').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');
      selectedTimeStr = element.innerText;
    }

    function updateCustomRules() {
      // Regla de Incompatibilidad: Si marca Premium, desactiva Salsa Suave
      const isPremium = document.getElementById('opt-premium').checked;
      const suaveContainer = document.getElementById('container-suave');
      if(isPremium) {
        suaveContainer.classList.add('disabled');
        document.getElementById('opt-suave').checked = false;
      } else {
        suaveContainer.classList.remove('disabled');
      }
    }

    function toggleCart() { document.getElementById('cart-modal').classList.toggle('active'); }
    function submitEvent() {
      if(!selectedTimeStr) { alert("Por favor elige una hora."); return; }
      alert("¡Evento Agendado con éxito para las " + selectedTimeStr + "!");
      document.getElementById('event-modal').classList.remove('active');
    }
  </script>
</body>
</html>
