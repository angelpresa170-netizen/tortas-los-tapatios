<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los Tapatíos & Carnitas - Web Pública</title>
  <style>
    :root {
      --garnet-main: #800020;
      --garnet-light: #a00028;
      --garnet-dark: #4a0013;
      --carnita-accent: #D9B59C;
      --bg-dark: #0d0d10;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(217, 181, 156, 0.2);
      --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      padding-bottom: 100px;
      overflow-x: hidden;
    }

    /* GLASSMORPHISM BASE */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: transform 0.3s var(--spring-easing), box-shadow 0.3s ease;
    }

    /* BOTONES FLOTANTES E INTERACTIVIDAD (iOS + SAMSUNG) */
    .btn-floating {
      background: linear-gradient(135deg, var(--garnet-light), var(--garnet-main));
      color: #fff;
      border: 1px solid var(--carnita-accent);
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(128, 0, 32, 0.5);
      transition: transform 0.2s var(--spring-easing), box-shadow 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-floating:active {
      transform: scale(0.94);
      box-shadow: 0 4px 15px -3px rgba(128, 0, 32, 0.3);
    }

    /* NAVBAR & CARRITO FLOTANTE */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 13, 16, 0.8);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--glass-border);
    }

    .brand-title {
      color: var(--carnita-accent);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .cart-trigger {
      position: relative;
    }

    .cart-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--carnita-accent);
      color: var(--garnet-dark);
      font-size: 0.75rem;
      font-weight: bold;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* GRID DE PRODUCTOS */
    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .section-title {
      color: var(--carnita-accent);
      margin: 25px 0 15px 0;
      font-size: 1.5rem;
      border-left: 4px solid var(--garnet-main);
      padding-left: 10px;
    }

    .grid-menu {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .item-card {
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-card h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .item-card p {
      color: #ccc;
      font-size: 0.85rem;
      margin-bottom: 15px;
    }

    .item-price {
      color: var(--carnita-accent);
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* SECCIÓN DE EVENTOS (DINÁMICA) */
    #events-section {
      display: none; /* Se activa desde Admin */
      margin-top: 40px;
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .package-card {
      padding: 25px;
      border: 1px solid var(--carnita-accent);
      position: relative;
    }

    .package-card.custom-pkg {
      border-style: dashed;
    }

    .feature-list {
      list-style: none;
      margin: 15px 0;
    }

    .feature-list li {
      margin-bottom: 8px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feature-list li.check { color: #4EAA25; }
    .feature-list li.cross { color: #E53935; opacity: 0.6; }

    /* MODALES & DRAWERS */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-content {
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 30px 30px 0 0;
      padding: 25px;
      background: #15151a;
      border: 1px solid var(--glass-border);
      transform: translateY(100%);
      transition: transform 0.3s var(--spring-easing);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--carnita-accent);
      font-size: 0.85rem;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      outline: none;
    }

    /* TIMEPICKER RADIAL SIMULADO & DATEPICKER MODERNOS */
    .picker-container {
      display: flex;
      gap: 10px;
    }

    .wheel-time {
      flex: 1;
      height: 100px;
      overflow-y: scroll;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      text-align: center;
      scroll-snap-type: y mandatory;
    }

    .wheel-time div {
      height: 40px;
      line-height: 40px;
      scroll-snap-align: center;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">LOS TAPATÍOS & CARNITAS</div>
    <button class="btn-floating cart-trigger" onclick="toggleCart()">
      🛒 Carrito
      <span class="cart-badge" id="cart-count">0</span>
    </button>
  </header>

  <div class="container">
    <h2 class="section-title">Menú Tradicional & Promociones</h2>
    <div class="grid-menu" id="menu-container">
      <!-- Cargado dinámicamente -->
    </div>

    <!-- SECCIÓN DE EVENTOS (SWITCH ACTIVABLE DESDE ADMIN) -->
    <div id="events-section">
      <h2 class="section-title">Contratación de Eventos y Banquetes</h2>
      <div class="events-grid" id="events-container">
        <!-- Paquetes predefinidos cargados dinámicamente -->
      </div>
    </div>
  </div>

  <!-- MODAL CARRITO -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-content">
      <h2 style="color:var(--carnita-accent); margin-bottom: 15px;">Tu Pedido</h2>
      <div id="cart-items"></div>
      <hr style="border-color: var(--glass-border); margin: 15px 0;">
      <h3 style="text-align: right; margin-bottom: 15px;">Total: <span id="cart-total">$0</span></h3>
      
      <div class="form-group">
        <label>Tipo de Entrega</label>
        <select id="delivery-type" onchange="toggleDeliveryOptions()">
          <option value="pickup">Recoger en Sucursal</option>
          <option value="delivery">A Domicilio</option>
        </select>
      </div>

      <div class="form-group" id="address-field" style="display:none;">
        <label>Dirección Completa</label>
        <input type="text" placeholder="Calle, número, colonia...">
      </div>

      <div class="form-group">
        <label>Método de Pago</label>
        <select id="payment-method" onchange="toggleCashOption()">
          <option value="cash">Efectivo</option>
          <option value="card">Tarjeta al entregar</option>
          <option value="transfer">Transferencia</option>
        </select>
      </div>

      <div class="form-group" id="cash-change-field">
        <label>¿Con cuánto vas a pagar? (Para llevar cambio)</label>
        <input type="number" id="cash-amount" placeholder="Ej: $500">
      </div>

      <button class="btn-floating" style="width:100%; justify-content: center;" onclick="checkout()">Confirmar Pedido</button>
    </div>
  </div>

  <!-- MODAL CHECKOUT EVENTOS -->
  <div class="modal-overlay" id="event-modal">
    <div class="modal-content">
      <h2 style="color:var(--carnita-accent); margin-bottom: 15px;">Agendar Evento</h2>
      <p id="selected-package-title" style="color: #ccc; margin-bottom: 15px;"></p>
      
      <div class="form-group">
        <label>Nombre del Contratante</label>
        <input type="text" id="event-name" placeholder="Nombre completo">
      </div>

      <div class="form-group">
        <label>Teléfono de Contacto</label>
        <input type="tel" id="event-phone" placeholder="33 0000 0000">
      </div>

      <div class="form-group">
        <label>Lugar/Dirección del Evento</label>
        <input type="text" id="event-address" placeholder="Ubicación completa">
      </div>

      <div class="form-group">
        <label>Fecha del Evento (Google Calendar Style)</label>
        <input type="date" id="event-date">
      </div>

      <div class="form-group">
        <label>Hora de Inicio (Selector Rueda)</label>
        <div class="picker-container">
          <div class="wheel-time">
            <div>12:00 PM</div><div>01:00 PM</div><div>02:00 PM</div><div>03:00 PM</div><div>04:00 PM</div><div>05:00 PM</div><div>06:00 PM</div>
          </div>
        </div>
      </div>

      <button class="btn-floating" style="width:100%; justify-content: center;" onclick="submitEvent()">Reservar Evento</button>
    </div>
  </div>

  <script>
    // SINCRONIZACIÓN LOCAL / EN TIEMPO REAL
    const channel = new BroadcastChannel('tapatos_sync');
    
    let cart = [];
    let state = {
      eventsActive: true,
      menu: [
        { id: 1, name: "Torta Ahogada Clasica", price: 85, desc: "Pan birote salado con carnitas jugosas." },
        { id: 2, name: "Tacos Dorados (Orden 3)", price: 60, desc: "Rellenos de papa o requesón con carnitas encima." }
      ],
      packages: [
        { id: 'p1', name: "Paquete 50 Personas", capacity: 50, price: 4500, features: [{text:"Carnitas mixtas 12kg", inc: true}, {text:"Salsas y verduras", inc: true}, {text:"Bebidas incluidas", inc: false}] },
        { id: 'p2', name: "Paquete 100 Personas", capacity: 100, price: 8500, features: [{text:"Carnitas mixtas 25kg", inc: true}, {text:"Salsas y verduras", inc: true}, {text:"Personal de servicio", inc: true}] }
      ]
    };

    function init() {
      renderMenu();
      renderEvents();
      
      // Escuchar cambios de Admin en vivo
      channel.onmessage = (event) => {
        if(event.data.type === 'UPDATE_STATE') {
          state = event.data.payload;
          renderMenu();
          renderEvents();
        }
      };
    }

    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = state.menu.map(item => `
        <div class="glass-card item-card">
          <div>
            <h3>${item.name}</h3>
            <p>${item.desc}</p>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="item-price">$${item.price}</span>
            <button class="btn-floating" onclick="addToCart(${item.id})">+</button>
          </div>
        </div>
      `).join('');
    }

    function renderEvents() {
      const eventsSec = document.getElementById('events-section');
      if(!state.eventsActive) {
        eventsSec.style.display = 'none';
        return;
      }
      eventsSec.style.display = 'block';

      const container = document.getElementById('events-container');
      let html = state.packages.map(pkg => `
        <div class="glass-card package-card">
          <h3>${pkg.name}</h3>
          <div class="item-price" style="margin: 10px 0;">$${pkg.price} MXN</div>
          <ul class="feature-list">
            ${pkg.features.map(f => `<li class="${f.inc ? 'check' : 'cross'}">${f.inc ? '✔️' : '❌'} ${f.text}</li>`).join('')}
          </ul>
          <button class="btn-floating" style="width:100%; justify-content:center;" onclick="openEventModal('${pkg.name}')">Contratar Paquete</button>
        </div>
      `).join('');

      // Opción de crear paquete personalizado
      html += `
        <div class="glass-card package-card custom-pkg">
          <h3>Diseña tu Paquete</h3>
          <p style="color:#ccc; font-size:0.85rem; margin: 10px 0;">Arma tu menú a la medida con delimitaciones inteligentes.</p>
          <button class="btn-floating" style="width:100%; justify-content:center;" onclick="openEventModal('Paquete Personalizado')">Crear Mi Paquete</button>
        </div>
      `;

      container.innerHTML = html;
    }

    function addToCart(id) {
      const item = state.menu.find(m => m.id === id);
      cart.push(item);
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.length;
      const cartItemsContainer = document.getElementById('cart-items');
      cartItemsContainer.innerHTML = cart.map((item, index) => `
        <div style="display:flex; justify-style:space-between; margin-bottom:10px;">
          <span>${item.name}</span>
          <span>$${item.price}</span>
        </div>
      `).join('');
      
      const total = cart.reduce((acc, curr) => acc + curr.price, 0);
      document.getElementById('cart-total').innerText = `$${total}`;
    }

    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('active');
    }

    function toggleDeliveryOptions() {
      const type = document.getElementById('delivery-type').value;
      document.getElementById('address-field').style.display = type === 'delivery' ? 'block' : 'none';
    }

    function toggleCashOption() {
      const method = document.getElementById('payment-method').value;
      document.getElementById('cash-change-field').style.display = method === 'cash' ? 'block' : 'none';
    }

    function openEventModal(title) {
      document.getElementById('selected-package-title').innerText = "Seleccionado: " + title;
      document.getElementById('event-modal').classList.add('active');
    }

    function checkout() {
      alert("¡Pedido realizado con éxito!");
      cart = [];
      updateCartUI();
      toggleCart();
    }

    function submitEvent() {
      alert("¡Solicitud de evento recibida! Nos pondremos en contacto.");
      document.getElementById('event-modal').classList.remove('active');
    }

    window.onload = init;
  </script>
</body>
</html>
